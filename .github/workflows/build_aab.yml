name: Build Android App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA Project Configuration
        run: |
          npx @bubblewrap/cli init --manifest=https://raw.githubusercontent.com/goalaiglobal-hue/goal-ai/main/manifest.json --meta=twa-manifest.json

      - name: Build Android Bundle (AAB)
        run: |
          npx @bubblewrap/cli build --manifest=twa-manifest.json

      - name: Upload AAB Package
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: ./**/*.aab
