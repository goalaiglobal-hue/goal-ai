name: Build Android TWA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder / Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA Project & Build AAB
        run: |
          yes | bubblewrap init --manifest=https://goal-ai-dw76.onrender.com/manifest.json --directory=twa-app || true
          cd twa-app
          yes | bubblewrap build || true

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: |
            twa-app/*.aab
            twa-app/*.apk
