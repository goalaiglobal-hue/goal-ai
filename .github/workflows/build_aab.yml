name: Build Android TWA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap Project
        run: |
          npx @bubblewrap/cli init --manifest=https://goal-ai-dw76.onrender.com/manifest.json --directory=twa-app --skipAsking

      - name: Build Android Bundle (AAB)
        run: |
          cd twa-app
          npx @bubblewrap/cli build --skipAsking

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: twa-app/*.aab
