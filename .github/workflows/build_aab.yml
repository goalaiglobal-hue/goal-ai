name: Build Android TWA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Build Android Package
        run: |
          pwabuilder Android --manifest ./manifest.json --out ./output --signing false

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: ./output/**/*
