name: Build Android TWA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Android App Bundle (AAB)
        uses: pwa-builder/pwa-action@v1.0.1
        with:
          pwa-url: 'https://goal-ai-dw76.onrender.com'
          output-type: 'aab'

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: ./*.aab
