name: Build Android TWA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build App from Local Manifest
        run: |
          npx @bubblewrap/cli init --manifest=./manifest.json --skipAsking
          npx @bubblewrap/cli build

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: ./**/*.aab
