name: Build Android TWA Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Android App Bundle
        run: |
          npx @pwabuilder/cli Android https://goal-ai-dw76.onrender.com -o ./output

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goal-ai-playstore-aab
          path: ./output/**/*
