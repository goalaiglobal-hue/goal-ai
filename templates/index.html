<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI - Elite Productivity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 selection:bg-indigo-500 selection:text-white">
    
    <!-- Top Bar (Email & Logout) -->
    <header class="w-full max-w-2xl flex items-center justify-between py-2 mb-2 border-b border-slate-800/60">
        <span class="text-xs text-slate-500 font-semibold tracking-wide uppercase">Goal AI SaaS</span>
        <div class="flex items-center space-x-3">
            <span class="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1 rounded-xl hidden sm:inline-block">{{ user_email }}</span>
            <a href="/logout" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 text-xs font-semibold px-3 py-1 rounded-xl transition">Logout</a>
        </div>
    </header>

    <!-- Original Center Brand Banner -->
    <div class="text-center my-6 space-y-2">
        <div class="inline-flex w-12 h-12 rounded-full bg-indigo-600/30 border border-indigo-500/50 items-center justify-center font-extrabold text-indigo-400 shadow-xl shadow-indigo-600/20 mb-1">
            AI
        </div>
        <h1 class="text-2xl font-black tracking-wider text-white uppercase">GOAL AI</h1>
        <p class="text-[11px] font-medium tracking-widest text-slate-400 uppercase">Plan • Focus • Achieve Your Dreams</p>
    </div>

    <!-- Main Container -->
    <main class="w-full max-w-2xl space-y-6">
        
        <!-- Goal Card -->
        <section class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Set Your Goal</h2>
                </div>
                <span id="progress-text" class="text-xs font-bold text-indigo-400">0%</span>
            </div>
            
            <div class="flex gap-2">
                <input type="text" id="goal-input" placeholder="e.g. Master Python Programming in 30 Days" 
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                <button onclick="saveGoal()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold text-xs px-5 rounded-xl transition shadow-lg shadow-indigo-600/20">
                    Save Goal
                </button>
            </div>
            <div class="mt-3 flex items-center justify-between text-xs text-slate-400">
                <span>ACTIVE GOAL: <strong id="active-goal-display" class="text-slate-200">None set</strong></span>
            </div>
        </section>

        <!-- Tasks Card -->
        <section class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center space-x-2 mb-3">
                <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Daily Action Plan</h2>
            </div>
            <div class="flex gap-2 mb-4">
                <input type="text" id="task-input" placeholder="Add a new daily task..." 
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                <button onclick="addTask()" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-white font-semibold text-xs px-5 rounded-xl transition border border-slate-700">
                    + Add Task
                </button>
            </div>
            <ul id="task-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"></ul>
        </section>

        <!-- AI Roadmap Card -->
        <section class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">AI Roadmap Generator</h2>
                </div>
            </div>
            <button onclick="generateRoadmap()" id="roadmap-btn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-xs py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-[0.99]">
                ⚡ Generate AI Roadmap
            </button>
            <div id="roadmap-container" class="mt-4 space-y-2.5"></div>
        </section>

    </main>

    <script>
        let currentGoal = "";
        let tasks = [];

        async function loadData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                if (data.goal) {
                    currentGoal = data.goal;
                    document.getElementById('goal-input').value = currentGoal;
                    document.getElementById('active-goal-display').innerText = currentGoal;
                }
                if (data.tasks) {
                    tasks = data.tasks;
                }
                renderTasks();
            } catch (e) {
                console.error("Load Error:", e);
            }
        }

        async function saveDataServer() {
            await fetch('/api/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ goal: currentGoal, tasks: tasks })
            });
        }

        function saveGoal() {
            const val = document.getElementById('goal-input').value.trim();
            if (!val) return alert("Please enter a valid goal!");
            currentGoal = val;
            document.getElementById('active-goal-display').innerText = currentGoal;
            saveDataServer();
            alert("Goal saved successfully!");
        }

        function addTask() {
            const val = document.getElementById('task-input').value.trim();
            if (!val) return;
            tasks.push({ text: val, completed: false });
            document.getElementById('task-input').value = "";
            renderTasks();
            saveDataServer();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
            saveDataServer();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
            saveDataServer();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = "";
            if (tasks.length === 0) {
                list.innerHTML = `<li class="text-xs text-slate-600 text-center py-3">No tasks added yet. Start planning above!</li>`;
                document.getElementById('progress-text').innerText = "0%";
                return;
            }

            let completedCount = 0;
            tasks.forEach((t, i) => {
                if (t.completed) completedCount++;
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3 rounded-xl border transition ${t.completed ? 'bg-slate-950/40 border-slate-900 text-slate-500 line-through' : 'bg-slate-950 border-slate-800 text-slate-200'}`;
                li.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer flex-1" onclick="toggleTask(${i})">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} class="w-4 h-4 rounded accent-indigo-600 cursor-pointer">
                        <span class="text-xs font-medium">${t.text}</span>
                    </div>
                    <button onclick="deleteTask(${i})" class="text-slate-600 hover:text-rose-400 text-xs px-2 py-1 transition">✕</button>
                `;
                list.appendChild(li);
            });

            const percent = Math.round((completedCount / tasks.length) * 100);
            document.getElementById('progress-text').innerText = percent + "%";
        }

        async function generateRoadmap() {
            if (!currentGoal) return alert("Please set and save a goal first!");
            const btn = document.getElementById('roadmap-btn');
            btn.innerText = "Generating AI Roadmap...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/roadmap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ goal: currentGoal })
                });
                const data = await res.json();
                const container = document.getElementById('roadmap-container');
                container.innerHTML = "";

                if (data.steps) {
                    data.steps.forEach((step, idx) => {
                        const div = document.createElement('div');
                        div.className = "p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300 flex items-start space-x-3";
                        div.innerHTML = `<span class="bg-indigo-600/20 text-indigo-400 font-bold px-2 py-0.5 rounded-md text-[10px]">0${idx+1}</span><span class="flex-1 mt-0.5">${step}</span>`;
                        container.appendChild(div);
                    });
                }
            } catch (e) {
                alert("Failed to generate roadmap.");
            } finally {
                btn.innerText = "⚡ Generate AI Roadmap";
                btn.disabled = false;
            }
        }

        loadData();
    </script>

<script>
// Auto-fetch data and update streak count safely
fetch('/api/data')
  .then(res => res.json())
  .then(data => {
      if(data.streak !== undefined) {
          document.getElementById('streak-count').innerText = data.streak;
      }
  }).catch(err => console.log(err));
</script>
</body>

</html>
