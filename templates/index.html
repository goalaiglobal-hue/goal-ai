<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md space-y-4">
        <header class="flex justify-between items-center py-4 border-b border-slate-800">
            <h1 class="text-xl font-bold text-cyan-400">GOAL AI</h1>
            <span class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-1 rounded">Beta</span>
        </header>

        <main class="space-y-4">
            <h2 class="text-lg font-semibold text-center">What do you want to achieve today?</h2>
            
            <form id="goalForm" class="flex gap-2">
                <input type="text" id="goalInput" placeholder="Set a new goal..." required
                    class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500">
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-600 text-black font-semibold text-sm px-4 py-2 rounded-lg">
                    Add
                </button>
            </form>

            <div id="goalsList" class="space-y-2 mt-4"></div>
        </main>
    </div>

    <script>
        const goalsList = document.getElementById('goalsList');
        const goalForm = document.getElementById('goalForm');
        const goalInput = document.getElementById('goalInput');

        function renderGoals(goals) {
            goalsList.innerHTML = '';
            goals.forEach(item => {
                const text = item.goal || item.title || 'Untitled Goal';
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-3 rounded-lg flex justify-between items-center shadow";
                card.innerHTML = `<span class="text-sm text-cyan-300 font-medium">${text}</span>`;
                goalsList.appendChild(card);
            });
        }

        async function loadGoals() {
            // First load from localStorage for instant zero-flicker display
            const savedLocal = localStorage.getItem('goal_ai_list');
            if (savedLocal) {
                try { renderGoals(JSON.parse(savedLocal)); } catch(e){}
            }

            // Then fetch live from server
            try {
                const res = await fetch('/goals');
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        localStorage.setItem('goal_ai_list', JSON.stringify(data));
                        renderGoals(data);
                    }
                }
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        goalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = goalInput.value.trim();
            if (!text) return;

            // Immediately save locally
            let current = [];
            try { current = JSON.parse(localStorage.getItem('goal_ai_list')) || []; } catch(e){}
            current.unshift({ goal: text, title: text });
            localStorage.setItem('goal_ai_list', JSON.stringify(current));
            renderGoals(current);

            goalInput.value = '';

            // Send to server
            try {
                await fetch('/goals', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ goal: text })
                });
            } catch (err) {
                console.error("Post error:", err);
            }
        });

        window.addEventListener('DOMContentLoaded', loadGoals);
    </script>
</body>
</html>
