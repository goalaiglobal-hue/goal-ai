<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI - Smart SaaS Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-purple: #6366f1;
            --accent-glow: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 2rem 1rem; }
        .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 1.5rem; }
        .header { text-align: center; margin-bottom: 0.5rem; }
        .avatar { width: 48px; height: 48px; background: linear-gradient(135deg, #a855f7, #6366f1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4); }
        .header h1 { font-size: 1.5rem; letter-spacing: 1px; font-weight: 700; }
        .header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.25rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .card-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem; }
        .input-group { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 0.65rem 0.85rem; color: var(--text-main); font-size: 0.88rem; outline: none; }
        input[type="text"]:focus { border-color: var(--accent-purple); }
        .btn { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; border-radius: 8px; padding: 0.65rem 1rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; width: 100%; }
        .progress-bar-bg { width: 100%; height: 6px; background: #0f172a; border-radius: 3px; overflow: hidden; margin-top: 0.5rem; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #ec4899); transition: width 0.4s ease; }
        .task-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
        .task-item { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 0.6rem 0.85rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
        .task-left { display: flex; align-items: center; gap: 0.6rem; flex: 1; }
        .task-checkbox { accent-color: var(--accent-purple); width: 16px; height: 16px; cursor: pointer; }
        .completed { text-decoration: line-through; color: var(--text-muted); }
        .btn-delete { background: transparent; color: #ef4444; border: none; font-size: 0.75rem; cursor: pointer; }
        .roadmap-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
        .roadmap-item { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
        .roadmap-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; }
        .badge { background: var(--accent-purple); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
        .roadmap-text { font-size: 0.85rem; line-height: 1.3; }
        .btn-import { background: #1e293b; color: #818cf8; border: 1px solid #475569; border-radius: 6px; padding: 0.35rem 0.6rem; font-size: 0.72rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-import:hover { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }
        .imported-badge { color: var(--success); font-size: 0.72rem; font-weight: 600; }
        .loader { border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid white; border-radius: 50%; width: 14px; height: 14px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="avatar">AI</div>
        <h1>GOAL AI</h1>
        <p>Plan • Focus • Achieve Your Dreams</p>
    </div>
    <div class="card">
        <div class="card-title">🎯 Set Your Goal</div>
        <div class="card-subtitle">Define your main focus target</div>
        <div class="input-group">
            <input type="text" id="goalInput" placeholder="e.g. Master Python Programming in 30 Days">
            <button class="btn" style="width: auto;" onclick="saveGoal()">Save Goal</button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
            <span>GOAL PROGRESS</span>
            <span id="progressText">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-title">📋 Daily Action Plan</div>
        <div class="card-subtitle">Manage daily action tasks for your goal</div>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new daily task...">
        </div>
        <button class="btn" onclick="addTask()">+ Add Task</button>
        <div class="task-list" id="taskList"></div>
    </div>
    <div class="card">
        <div class="card-title">🧩 AI Roadmap Generator</div>
        <div class="card-subtitle">Generate a 4-phase execution plan for your active goal</div>
        <button class="btn" id="generateBtn" onclick="generateRoadmap()">
            <span id="btnText">⚡ Generate AI Roadmap</span>
        </button>
        <div id="roadmapContainer" style="display: none; margin-top: 1rem;">
            <div style="font-size: 0.8rem; color: var(--accent-glow); font-weight: 600; margin-bottom: 0.5rem;" id="roadmapTitle">🤖 AI Roadmap Milestones:</div>
            <div class="roadmap-list" id="roadmapList"></div>
        </div>
    </div>
</div>
<script>
    let currentGoal = '';
    let tasks = [];
    let roadmapSteps = [];
    function updateProgress() {
        if (tasks.length === 0) {
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';
            return;
        }
        const completed = tasks.filter(t => t.completed).length;
        const percentage = Math.round((completed / tasks.length) * 100);
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('progressText').innerText = percentage + '%';
    }
    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        tasks.forEach((task, index) => {
            const item = document.createElement('div');
            item.className = 'task-item';
            item.innerHTML = `<div class="task-left"><input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})"><span class="${task.completed ? 'completed' : ''}">${task.text}</span></div><button class="btn-delete" onclick="deleteTask(${index})">Delete</button>`;
            list.appendChild(item);
        });
        updateProgress();
    }
    function saveGoal() {
        const val = document.getElementById('goalInput').value.trim();
        if (val) { currentGoal = val; alert('Goal saved successfully!'); }
    }
    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();
        if (text) { tasks.push({ text: text, completed: false }); input.value = ''; renderTasks(); }
    }
    function deleteTask(index) { tasks.splice(index, 1); renderTasks(); }
    async function generateRoadmap() {
        const goal = document.getElementById('goalInput').value.trim() || currentGoal;
        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        btnText.innerHTML = '<span class="loader"></span> Generating AI Plan...';
        btn.disabled = true;
        try {
            const res = await fetch('/api/roadmap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ goal: goal }) });
            const data = await res.json();
            if (data.steps && data.steps.length > 0) { roadmapSteps = data.steps; renderRoadmap(goal); }
        } catch (err) { console.error(err); alert('Error generating roadmap!'); }
        finally { btnText.innerHTML = '⚡ Generate AI Roadmap'; btn.disabled = false; }
    }
    function renderRoadmap(goal) {
        const container = document.getElementById('roadmapContainer');
        const list = document.getElementById('roadmapList');
        document.getElementById('roadmapTitle').innerText = `🤖 AI Roadmap for: "${goal}"`;
        list.innerHTML = '';
        roadmapSteps.forEach((step, idx) => {
            const isImported = tasks.some(t => t.text === step);
            const item = document.createElement('div');
            item.className = 'roadmap-item';
            item.innerHTML = `<div class="roadmap-left"><div class="badge">${idx + 1}</div><div class="roadmap-text">${step}</div></div>${isImported ? '<span class="imported-badge">✓ Added</span>' : `<button class="btn-import" onclick="importTask('${escapeHtml(step)}', this)">+ Add Task</button>`}`;
            list.appendChild(item);
        });
        container.style.display = 'block';
    }
    function importTask(stepText, btnElement) {
            tasks.push({ text: stepText, completed: false });
            renderTasks();
            if (btnElement) {
                const parent = btnElement.parentElement;
                btnElement.remove();
                const badge = document.createElement('span');
                badge.className = 'imported-badge';
                badge.innerText = '✓ Added';
                parent.appendChild(badge);
            }
        }
    }
    function escapeHtml(text) { return text.replace(/'/g, "\'").replace(/"/g, '&quot;'); }
</script>
</body>
</html>
