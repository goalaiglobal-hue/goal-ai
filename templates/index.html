<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal AI - SaaS Productivity Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center justify-start p-4 sm:p-6">

    <!-- Header Section -->
    <header class="w-full max-w-2xl text-center my-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-600/20 text-indigo-400 font-bold text-xl mb-3 border border-indigo-500/30">
            AI
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">GOAL AI</h1>
        <p class="text-xs font-medium text-slate-400 uppercase tracking-widest">Plan • Focus • Achieve Your Dreams</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl space-y-6">

        <!-- Active Goal Box -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-rose-500">🎯</span>
                <h2 class="text-sm font-semibold text-slate-200">Set Your Goal</h2>
            </div>
            <p class="text-xs text-slate-400 mb-3">Define your main focus target</p>
            
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="goalInput" placeholder="e.g. Master Python Programming in 30 Days" class="flex-1 bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                <button onclick="saveGoal()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium text-sm px-5 py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                    Save Goal
                </button>
            </div>

            <div class="mt-4 flex justify-between items-center text-xs text-slate-400 pt-3 border-t border-slate-800/60">
                <div>ACTIVE GOAL: <span id="activeGoalText" class="text-indigo-400 font-medium">None set</span></div>
                <div><span id="progressText">0%</span></div>
            </div>
        </section>

        <!-- Daily Action Plan -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-amber-400">📋</span>
                <h2 class="text-sm font-semibold text-slate-200">Daily Action Plan</h2>
            </div>
            <p class="text-xs text-slate-400 mb-4">Manage daily action tasks for your goal</p>

            <div class="space-y-2 mb-4">
                <input type="text" id="taskInput" placeholder="Add a new daily task..." class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                <button onclick="addTask()" class="w-full bg-indigo-600/90 hover:bg-indigo-600 active:scale-95 text-white font-medium text-sm py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                    + Add Task
                </button>
            </div>

            <div id="taskList" class="space-y-2">
                <!-- Dynamic Tasks Render Here -->
            </div>
        </section>

        <!-- AI Roadmap Generator -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-emerald-400">🧩</span>
                <h2 class="text-sm font-semibold text-slate-200">AI Roadmap Generator</h2>
            </div>
            <p class="text-xs text-slate-400 mb-4">Generate a 4-phase execution plan for your active goal</p>

            <button onclick="generateRoadmap()" id="roadmapBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold text-sm py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                ⚡ Generate AI Roadmap
            </button>

            <div id="roadmapResults" class="mt-4 space-y-2 hidden">
                <div class="text-xs font-medium text-indigo-400 mb-2 flex items-center gap-1.5">
                    <span>🤖</span> AI Roadmap for: <span id="roadmapGoalTitle" class="italic">""</span>
                </div>
                <div id="roadmapList" class="space-y-2"></div>
            </div>
        </section>

    </main>

    <script>
        let appState = {
            goal: '',
            tasks: []
        };

        // Load data on start
        window.addEventListener('DOMContentLoaded', loadCloudData);

        async function loadCloudData() {
            try {
                const res = await fetch('/api/data');
                if (res.ok) {
                    const data = await res.json();
                    if (data.goal) {
                        appState.goal = data.goal;
                        document.getElementById('goalInput').value = data.goal;
                        document.getElementById('activeGoalText').innerText = data.goal;
                    }
                    if (data.tasks) {
                        appState.tasks = data.tasks;
                        renderTasks();
                    }
                }
            } catch (err) {
                console.error('Failed to load cloud data:', err);
            }
        }

        async function syncCloudData() {
            try {
                await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appState)
                });
            } catch (err) {
                console.error('Sync failed:', err);
            }
        }

        function saveGoal() {
            const val = document.getElementById('goalInput').value.trim();
            if (!val) {
                alert('Please enter a goal first!');
                return;
            }
            appState.goal = val;
            document.getElementById('activeGoalText').innerText = val;
            syncCloudData();
            alert('Goal saved successfully: ' + val);
        }

        function addTask(taskText = null) {
            const input = document.getElementById('taskInput');
            const text = taskText || input.value.trim();
            
            if (!text) {
                alert('Task description cannot be empty!');
                return;
            }

            appState.tasks.push({ text: text, done: false });
            if (!taskText) input.value = '';
            
            renderTasks();
            syncCloudData();
        }

        function toggleTask(index) {
            appState.tasks[index].done = !appState.tasks[index].done;
            renderTasks();
            syncCloudData();
        }

        function deleteTask(index) {
            appState.tasks.splice(index, 1);
            renderTasks();
            syncCloudData();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            let doneCount = 0;

            appState.tasks.forEach((task, idx) => {
                if (task.done) doneCount++;

                const item = document.createElement('div');
                item.className = 'flex items-center justify-between bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-sm transition';
                
                item.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask(${idx})">
                        <input type="checkbox" ${task.done ? 'checked' : ''} class="w-4 h-4 accent-indigo-500 rounded cursor-pointer">
                        <span class="${task.done ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${idx})" class="text-slate-500 hover:text-rose-400 text-xs px-2 py-1 transition">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                list.appendChild(item);
            });

            // Update Progress Percentage
            const total = appState.tasks.length;
            const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
            document.getElementById('progressText').innerText = pct + '%';
        }

        async function generateRoadmap() {
            if (!appState.goal) {
                alert('Please set and save an Active Goal first!');
                return;
            }

            const btn = document.getElementById('roadmapBtn');
            btn.disabled = true;
            btn.innerHTML = '⚡ Generating AI Roadmap...';

            try {
                const res = await fetch('/api/roadmap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ goal: appState.goal })
                });

                const data = await res.json();
                if (data.steps && data.steps.length > 0) {
                    document.getElementById('roadmapGoalTitle').innerText = '"' + appState.goal + '"';
                    const list = document.getElementById('roadmapList');
                    list.innerHTML = '';

                    data.steps.forEach((step, idx) => {
                        const stepBox = document.createElement('div');
                        stepBox.className = 'flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-xs';
                        stepBox.innerHTML = `
                            <div class="flex items-start gap-2.5 flex-1 pr-2">
                                <span class="w-5 h-5 rounded-full bg-indigo-600/30 text-indigo-400 font-bold flex items-center justify-center shrink-0 text-[10px]">
                                    ${idx + 1}
                                </span>
                                <span class="text-slate-300 leading-relaxed">${step}</span>
                            </div>
                            <button onclick="addTask('${step.replace(/'/g, "\\'")}')" class="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 px-2.5 py-1.5 rounded-lg text-[11px] transition shrink-0">
                                + Add Task
                            </button>
                        `;
                        list.appendChild(stepBox);
                    });

                    document.getElementById('roadmapResults').classList.remove('hidden');
                } else {
                    alert('Could not generate roadmap. Please try again.');
                }
            } catch (err) {
                alert('Error connecting to AI service.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '⚡ Generate AI Roadmap';
            }
        }
    </script>
</body>
</html>
