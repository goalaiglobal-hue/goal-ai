<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Goal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-white mb-1">Create Account</h1>
            <p class="text-xs text-slate-400">Start achieving your goals with Goal AI</p>
        </div>
        <form onsubmit="handleSignup(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm py-2.5 rounded-xl transition">
                Create Account
            </button>
        </form>
        <div class="text-center text-xs text-slate-400">
            Already have an account? <a href="/login" class="text-indigo-400 font-medium hover:underline">Log in</a>
        </div>
    </div>
    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/';
            } else {
                alert(data.error || 'Signup failed');
            }
        }
    </script>
</body>
</html>
